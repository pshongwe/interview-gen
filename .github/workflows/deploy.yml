name: Deploy Frontend and Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy Frontend (GitHub Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Build Angular app
        working-directory: client
        run: npm run build -- --configuration production --base-href "./"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist/interview-question-generator

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    name: Deploy Backend (Webhook)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Validate backend source
        working-directory: server
        run: node --check index.js

      - name: Trigger backend deployment
        if: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL != '' }}
        env:
          BACKEND_DEPLOY_WEBHOOK_URL: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL }}
        run: curl --fail-with-body --location --request POST "$BACKEND_DEPLOY_WEBHOOK_URL"

      - name: Missing backend deploy secret
        if: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL == '' }}
        run: |
          echo "Repository secret BACKEND_DEPLOY_WEBHOOK_URL is required."
          echo "Add your Render/Railway/other deploy hook URL in repo settings."
          exit 1
